name: Update M3U Playlist

on:
  schedule:
    # Jalan tiap 4 jam. Ubah sesuai kebutuhan (format cron UTC).
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Setup Deno (dibutuhkan yt-dlp untuk extract YouTube)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Generate playlist
        run: python generate_m3u.py

      - name: Commit playlist jika berubah
        run: |
          git config user.name "playlist-bot"
          git config user.email "actions@users.noreply.github.com"
          git add playlist.m3u
          git diff --staged --quiet || git commit -m "Update playlist.m3u [auto]"
          git push
